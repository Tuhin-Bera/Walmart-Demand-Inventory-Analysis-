<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Inter Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Charting Engines: Chart.js & Plotly -->

<div class="shell">

  <!-- ── Left Sidebar Navigation ─────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-section">Analytics &amp; Planning</div>

    <button class="nav-item active" data-page="overview">
      <span class="icon">📊</span> Overview

    <button class="nav-item" data-page="forecast">
      <span class="icon">📈</span> Demand Forecast
    </button>
    <button class="nav-item" data-page="compare">

    <div style="padding:10px 14px;font-size:0.78rem;color:var(--text-sec);line-height:1.9;background:rgba(255,255,255,0.02);border-radius:8px;border:1px solid var(--border);">

      🎯 <strong>OR-Tools</strong> GLOP Optimizer

    <div class="spinner-wrap" style="height:60vh;">
      <div class="spinner"></div>

<!-- ── Toast System ───────────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── Application Scripts ────────────────────────────────────────────────── -->
<script src="js/api.js"></script>
