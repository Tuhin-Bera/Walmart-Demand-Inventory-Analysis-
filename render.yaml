services:
  - type: web
    name: walmart-demand-inventory-ai
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SAMPLE_STORES
        value: CA_1,TX_1,WI_1
      - key: HISTORY_DAYS
        value: 180
      - key: N_EVAL_DAYS
        value: 28
      - key: DEFAULT_HOLDING_COST
        value: 0.20
      - key: DEFAULT_STOCKOUT_COST
        value: 2.00
      - key: DEFAULT_SAFETY_STOCK_FACTOR
        value: 1.65
      # Dataset Download URLs from Google Drive
      - key: DATA_SALES_VALIDATION_URL
        value: https://drive.google.com/file/d/1BMf1VgeAkkwmlEsdliqQ3cIr1oxvC6fU/view?usp=sharing
      - key: DATA_SELL_PRICES_URL
        value: https://drive.google.com/file/d/10LCz2fDeDwkDMwLe_Eqc9nd0b3_T5B_h/view?usp=sharing

